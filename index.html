<!DOCTYPE html>
<html lang="en">
<head>

<title>Yara's Birthday Quest</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}

.heroic{position:absolute;left:46%;bottom:5%;transform:translateX(-50%);z-index:3}

.cabin.show{transform:translateX(-50%) scale(1)}
.cabin.show rect[fill='#ffd56b']{animation:glowwin 2.4s ease-in-out infinite}

.cabin.talking svg{animation:float 1.6s ease-in-out infinite;filter:drop-shadow(0 0 10px #ffd56b)}
.cardwrap{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:10px;background:rgba(13,24,56,.28);z-index:8}
.cardwrap .card{max-height:100%}
#voiceBtn .win{transition:fill .3s}
#voiceBtn.live .win{animation:glowwin 1.2s ease-in-out infinite}
.pulse-btn{animation:pulse 1.4s ease-in-out infinite}
.giftrow{position:absolute;left:0;right:0;top:60%;display:flex;justify-content:center;gap:6px;z-index:3;pointer-events:none}

.heroic svg{transition:filter .6s}
.card{background:#fff;border:3px solid #4a2c14;border-radius:20px;box-shadow:0 5px 0 #4a2c14;padding:14px 16px 12px;max-width:380px;width:94%;max-height:100%;overflow:auto;animation:pop .6s cubic-bezier(.3,1.6,.5,1)}
.card h2{margin:4px 0 8px;color:#e07b12;font-size:24px}
.card p{white-space:normal;font-size:16px;line-height:1.38;margin:0 0 8px;text-align:left}
#chapter{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;margin-right:6px}
#strings{white-space:nowrap}
@media (max-width:380px){#hud{padding:8px 8px;font-size:13px}#strings b{width:21px;height:21px;line-height:21px;font-size:11px;margin-left:2px}#bagBtn,#muteBtn{font-size:12px;padding:2px 5px;margin-left:4px}}
@media (max-height:700px){.card p{font-size:15px;line-height:1.33}.card h2{font-size:21px}.cardtop{font-size:22px}}
.cardtop{font-size:26px;letter-spacing:3px}
.sig{text-align:right;font-weight:700}
.label{background:rgba(255,255,255,.92);border:2px solid #4a2c14;border-radius:10px;padding:2px 8px;font-size:13px;font-weight:600}
</style>

<body>
<div id="game">
  <div id="hud"><span id="chapter">🪽🎶🌻</span><span class="right"><span id="strings"><b>G</b><b>D</b><b>A</b><b>E</b></span><button id="bagBtn">🎁 0</button><button id="muteBtn">🔊</button></span></div>
  <div id="art"><div id="bg"></div><div id="stage"></div></div>
  <div id="boxwrap"><div id="box"><div id="who"></div><div id="text"></div><div id="choices"></div><div id="more">▼</div></div></div>
  <div id="toast"></div>
  <div id="pop" class="overlay"></div>
</div>
<canvas id="confetti"></canvas>
<script>
/* ============ EDIT YOUR MESSAGE HERE ============ */
const FINAL_MESSAGE = `Happy birthday to the kindest angel and cutest baby ever!

Thank you for gracing my heart and probably the whole world with your benevolence.

You are the sun and its warmth, the beach and its fun. And within you, you will find the strength to tame the world.

My heart and soul will always continue to shine brighter because of you.`;
const FROM = "Hattan";
/* ================================================ */

const $ = s => document.querySelector(s);
const art = $('#stage'), box = $('#box'), who = $('#who'), text = $('#text'), choicesEl = $('#choices'), pop = $('#pop');
const state = { sugar: 0, skips: 0, gifts: [], strings: [] };
const sleep = ms => new Promise(r => setTimeout(r, ms));
const rand = n => Math.floor(Math.random() * n);
const shuffle = a => { a = [...a]; for(let i = a.length - 1; i > 0; i--){ const j = rand(i + 1); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const has = g => state.gifts.includes(g);

/* ---------- audio ---------- */
let AC = null, BUS = null, VERB = null, MUTED = false;
try{ MUTED = localStorage.getItem('yaraMuted') === '1'; }catch(e){}
/* master chain: gentle compressor (keeps loud chords from clipping) + a soft room reverb */
function buildGraph(ac){
  const comp = ac.createDynamicsCompressor();
  comp.threshold.value = -14; comp.knee.value = 10; comp.ratio.value = 8; comp.attack.value = 0.003; comp.release.value = 0.2;
  const master = ac.createGain(); master.gain.value = MUTED ? 0 : 1;
  master.connect(comp); comp.connect(ac.destination);
  const len = Math.floor(ac.sampleRate * 1.2), ir = ac.createBuffer(2, len, ac.sampleRate);
  for(let c = 0; c < 2; c++){ const d = ir.getChannelData(c); for(let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 3.5); }
  const conv = ac.createConvolver(); conv.buffer = ir;
  const pre = ac.createBiquadFilter(); pre.type = 'lowpass'; pre.frequency.value = 3200;
  const wet = ac.createGain(); wet.gain.value = 0.32;
  pre.connect(conv); conv.connect(wet); wet.connect(master);
  BUS = master; VERB = pre;
}
function resetGraph(){ buildGraph(AC); }
function audio(){
  try{
    if(!AC){ AC = new (window.AudioContext || window.webkitAudioContext)(); buildGraph(AC); }
    if(AC.state === 'suspended') AC.resume();
  }catch(e){}
  return AC;
}
function setMuted(m){ MUTED = m; try{ localStorage.setItem('yaraMuted', m ? '1' : '0'); }catch(e){} if(BUS) BUS.gain.value = m ? 0 : 1; }
function out(node, wet){
  node.connect(BUS);
  if(wet > 0){ const g = AC.createGain(); g.gain.value = wet; node.connect(g); g.connect(VERB); }
}
const NOTE = m => 440 * Math.pow(2, (m - 69) / 12);
function envelope(g, t, dur, vol, a, r){
  g.gain.setValueAtTime(0.0001, t);
  g.gain.linearRampToValueAtTime(vol, t + a);
  g.gain.setValueAtTime(vol, t + Math.max(a, dur - r));
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur + 0.04);
}
/* violin: additive synthesis. Each harmonic (1/k, as in a bowed string's Helmholtz motion) is weighted by a
   violin-body resonance curve (main air/body modes ~275-1150 Hz, "bridge hill" ~2.3-3.2 kHz), low notes have
   their upper harmonics tamed (less roughness), plus a short bow-noise attack and a tiny slide into the note.
   vib = vibrato depth as a fraction of frequency. Default 0.010 = about 35 cents peak-to-peak (nominal) at 6 Hz,
   in line with measured violin vibrato (Fletcher & Sanders 1967). Ear tests use 0.002, tuning uses 0 (dead straight). */
const BODY = [[275, 1.0, 60], [460, 0.8, 70], [540, 0.7, 80], [700, 0.45, 120], [900, 0.4, 150], [1150, 0.35, 200], [2300, 0.55, 500], [2750, 0.6, 500], [3200, 0.4, 500]];
function bodyGain(f){
  let s = 0.12;
  BODY.forEach(([fr, a, bw]) => { s += a / (1 + Math.pow((f - fr) / (bw / 2), 2)); });
  s *= 1 + 0.25 * Math.sin(f / 37) + 0.15 * Math.sin(f / 13.3);
  return f > 4500 ? s * Math.exp(-(f - 4500) / 1500) : s;
}
function tone(freq, dur = 0.5, when = 0, vol = 0.16, vib = 0.010){
  const ac = audio(); if(!ac) return;
  const t = ac.currentTime + when;
  const g = ac.createGain();
  envelope(g, t, dur, vol * 1.45, Math.min(0.08, dur * 0.3), Math.min(0.16, dur * 0.35));
  let vg = null;
  if(vib > 0){
    const lfo = ac.createOscillator(); lfo.frequency.value = 6.0;
    vg = ac.createGain(); vg.gain.setValueAtTime(0, t); vg.gain.setValueAtTime(0, t + 0.12); vg.gain.linearRampToValueAtTime(vib, t + 0.45);
    lfo.connect(vg); lfo.start(t); lfo.stop(t + dur + 0.2);
  }
  const slide = vib >= 0.004;
  const N = Math.min(30, Math.floor(5000 / freq));
  const amps = []; let norm = 0;
  for(let k = 1; k <= N; k++){
    const tame = freq < 300 ? (k > 5 ? Math.pow(5 / k, 1.8) : 1) : (k > 8 ? 8 / k : 1);
    const a = (1 / k) * bodyGain(k * freq) * Math.exp(-Math.max(0, k * freq - 1800) / 2200) * tame;
    amps.push(a); norm += a * a;
  }
  norm = Math.sqrt(norm);
  for(let k = 1; k <= N; k++){
    if(amps[k - 1] / norm < 0.015) continue;   /* inaudible partial: skip it to save CPU on phones */
    const o = ac.createOscillator(); o.type = 'sine';
    if(slide){ o.frequency.setValueAtTime(k * freq * Math.pow(2, -12 / 1200), t); o.frequency.exponentialRampToValueAtTime(k * freq, t + 0.05); }
    else o.frequency.value = k * freq;
    if(vg){ const m = ac.createGain(); m.gain.value = k * freq; vg.connect(m); m.connect(o.frequency); }
    const ag = ac.createGain(); ag.gain.value = amps[k - 1] / norm;
    o.connect(ag); ag.connect(g); o.start(t); o.stop(t + dur + 0.1);
  }
  if(vib > 0){
    const nb = ac.createBuffer(1, Math.ceil(ac.sampleRate * Math.min(dur + 0.1, 0.6)), ac.sampleRate), d = nb.getChannelData(0);
    for(let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    const ns = ac.createBufferSource(); ns.buffer = nb;
    const nf = ac.createBiquadFilter(); nf.type = 'bandpass'; nf.frequency.value = 3000; nf.Q.value = 0.7;
    const ng = ac.createGain(); ng.gain.setValueAtTime(0.12, t); ng.gain.exponentialRampToValueAtTime(0.02, t + 0.12);
    ns.connect(nf); nf.connect(ng); ng.connect(g); ns.start(t); ns.stop(t + Math.min(dur + 0.1, 0.6));
  }
  out(g, vib > 0 ? 0.55 : 0.12);
}
/* Hattan's singing voice: a sawtooth through three vowel formants ("ah"), so it sounds sung, not buzzed */
function voice(freq, dur = 0.4, when = 0, vib = 0.018){
  const ac = audio(); if(!ac) return;
  const t = ac.currentTime + when;
  const o = ac.createOscillator(); o.type = 'sawtooth'; o.frequency.value = freq;
  const lfo = ac.createOscillator(); lfo.frequency.value = 6.3;
  const vg = ac.createGain(); vg.gain.value = freq * vib;
  lfo.connect(vg); vg.connect(o.frequency);
  const g = ac.createGain();
  envelope(g, t, dur, 0.8, 0.04, 0.08);
  /* smoother, voice-like source (falls off above the 3rd harmonic) before the "ah" formants: much less rough */
  const glot = ac.createBiquadFilter(); glot.type = 'lowpass'; glot.frequency.value = freq * 3; glot.Q.value = 0.5;
  o.connect(glot);
  [[720, 1.0, 7], [1150, 0.55, 9], [2550, 0.22, 11]].forEach(([f, amp, q]) => {
    const bp = ac.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = f; bp.Q.value = q;
    const ag = ac.createGain(); ag.gain.value = amp * 1.15;
    glot.connect(bp); bp.connect(ag); ag.connect(g);
  });
  const low = ac.createBiquadFilter(); low.type = 'lowpass'; low.frequency.value = 420;
  const lg = ac.createGain(); lg.gain.value = 0.16; o.connect(low); low.connect(lg); lg.connect(g);
  out(g, 0.35);
  o.start(t); lfo.start(t); o.stop(t + dur + 0.1); lfo.stop(t + dur + 0.1);
}
/* soft harp/celesta-like pluck */
function pluck(freq, vol = 0.22, when = 0){
  const ac = audio(); if(!ac) return;
  const t = ac.currentTime + when;
  const g = ac.createGain();
  g.gain.setValueAtTime(0.0001, t); g.gain.linearRampToValueAtTime(vol * 1.45, t + 0.005); g.gain.exponentialRampToValueAtTime(0.0008, t + 1.0);
  [[1, 'triangle', 1], [2, 'sine', 0.25]].forEach(([mult, type, amp]) => {
    const o = ac.createOscillator(); o.type = type; o.frequency.value = freq * mult;
    const ag = ac.createGain(); ag.gain.value = amp; o.connect(ag); ag.connect(g); o.start(t); o.stop(t + 1.05);
  });
  out(g, 0.4);
}
/* warm pad for the finale accompaniment */
function pad(freq, dur, when = 0, vol = 0.05){
  const ac = audio(); if(!ac) return;
  const t = ac.currentTime + when;
  const g = ac.createGain(); envelope(g, t, dur, vol, 0.18, 0.35);
  const lp = ac.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 1100;
  [-4, 4].forEach(c => { const o = ac.createOscillator(); o.type = 'triangle'; o.frequency.value = freq * Math.pow(2, c / 1200); o.connect(lp); o.start(t); o.stop(t + dur + 0.1); });
  lp.connect(g); out(g, 0.6);
}
/* woodblock-ish metronome tick (soft attack, so no hard click edge) */
function click(when, accent){
  const ac = audio(); if(!ac) return;
  const t = ac.currentTime + when;
  const o = ac.createOscillator(); o.type = 'sine'; o.frequency.setValueAtTime(accent ? 1900 : 1500, t); o.frequency.exponentialRampToValueAtTime(accent ? 1300 : 1000, t + 0.05);
  const g = ac.createGain(); g.gain.setValueAtTime(0.0001, t); g.gain.linearRampToValueAtTime(accent ? 0.42 : 0.3, t + 0.002); g.gain.exponentialRampToValueAtTime(0.0005, t + 0.07);
  o.connect(g); out(g, 0); o.start(t); o.stop(t + 0.09);
}
function blip(){ const ac = audio(); if(!ac) return; const t = ac.currentTime; const o = ac.createOscillator(); o.type = 'sine'; o.frequency.value = 1050; const g = ac.createGain(); g.gain.setValueAtTime(0.0001, t); g.gain.linearRampToValueAtTime(0.11, t + 0.004); g.gain.exponentialRampToValueAtTime(0.0005, t + 0.06); o.connect(g); out(g, 0); o.start(t); o.stop(t + 0.08); }
/* gentle "bonk" for mistakes: falling sine, no harsh buzz */
function buzz(){
  const ac = audio(); if(!ac) return;
  const t = ac.currentTime;
  const o = ac.createOscillator(); o.type = 'triangle'; o.frequency.setValueAtTime(300, t); o.frequency.exponentialRampToValueAtTime(140, t + 0.2);
  const g = ac.createGain(); g.gain.setValueAtTime(0.0001, t); g.gain.linearRampToValueAtTime(0.32, t + 0.008); g.gain.exponentialRampToValueAtTime(0.0005, t + 0.26);
  o.connect(g); out(g, 0.1); o.start(t); o.stop(t + 0.3);
}

  return new Promise(res => {

}

/* ---------- optional private voice message ----------
   If a file named voice.m4a / voice.mp3 / voice.wav / voice.ogg / voice.opus / voice.aac sits in the same folder
   as this page, it plays from the cabin window in the finale. It is loaded as-is; nothing is changed. */
const VOICE = { el: null, ok: false, arm: false, unlocked: false };
(function(){
  try{
    const a = document.createElement('audio'); a.preload = 'auto';
    ['m4a', 'mp3', 'wav', 'ogg', 'opus', 'aac'].forEach(ext => { const src = document.createElement('source'); src.src = 'voice.' + ext; a.appendChild(src); });
    a.addEventListener('loadedmetadata', () => { VOICE.ok = true; });
    a.addEventListener('canplay', () => { VOICE.ok = true; });
    document.body.appendChild(a); a.load(); VOICE.el = a;
  }catch(e){}
})();
/* phones only allow sound from a tap, so the first tap in the finale quietly "unlocks" the recording
   (muted play + pause, nothing is heard); it can then start by itself when the card appears */
function unlockVoice(){
  const a = VOICE.el; if(!a || VOICE.unlocked) return;
  VOICE.unlocked = true;
  try{ a.muted = true; const pr = a.play(); const back = () => { a.pause(); a.currentTime = 0; a.muted = MUTED; };
       if(pr && pr.then) pr.then(back).catch(() => { VOICE.unlocked = false; a.muted = MUTED; }); else back(); }catch(e){ VOICE.unlocked = false; }
}
/* Hattan's recording plays from the cabin window; the story waits until it has finished */
function ctrlBtn(label, alt){ const b = document.createElement('button'); b.className = 'btn' + (alt ? ' alt' : ''); b.textContent = label; choicesEl.appendChild(b); return b; }
async function listenAtWindow(){
  const a = VOICE.el, cabin = art.querySelector('.cabin');
  let isEnded = false;
  const ended = new Promise(r => { a.onended = () => { isEnded = true; r(); }; a.onerror = () => { isEnded = true; r(); }; });
  a.onplay = () => cabin.classList.add('talking');
  a.onpause = () => cabin.classList.remove('talking');
  try{ a.currentTime = 0; a.muted = MUTED; await a.play(); }catch(e){}
  if(a.paused && !isEnded){
    /* the phone blocked it from starting by itself: one tap starts it */
    await new Promise(r => {
      info('🏡 The window is glowing…');
      const b = ctrlBtn('▶️ Listen at the window'); b.classList.add('pulse-btn');
      b.onclick = e => { e.stopPropagation(); a.muted = MUTED; a.play().catch(() => {}); r(); };
    });
  }
  await say('Yara', 'Okay. Now I\'m crying. 😭');
  if(!isEnded){
    await new Promise(res => {
      const draw = () => {
        if(isEnded) return;
        info(a.paused ? '🏡 Paused.' : '🎶 Listening at the warm window…');
        const pp = ctrlBtn(a.paused ? '▶️ Listen' : '⏸️ Pause');
        pp.onclick = e => { e.stopPropagation(); if(a.paused){ a.muted = MUTED; a.play().catch(() => {}); } else a.pause(); };
        if(a.paused){ const c = ctrlBtn('Continue →', true); c.onclick = e => { e.stopPropagation(); res(); }; }
      };
      a.onplay = () => { cabin.classList.add('talking'); draw(); };
      a.onpause = () => { cabin.classList.remove('talking'); draw(); };
      ended.then(res);
      draw();
    });
  }
  try{ a.pause(); a.currentTime = 0; }catch(e){}
  a.onplay = a.onpause = a.onended = a.onerror = null;
  cabin.classList.remove('talking');
  info('');
}

/* ---------- canvas helper ---------- */
function makeCanvas(goalText){
  art.innerHTML = `<div class="goal">${goalText}</div><canvas class="play"></canvas>`;
  const cv = art.querySelector('canvas'), dpr = window.devicePixelRatio || 1;
  const W = art.clientWidth, H = art.clientHeight;
  cv.width = W * dpr; cv.height = H * dpr;
  const ctx = cv.getContext('2d'); ctx.scale(dpr, dpr);
  return { cv, ctx, W, H, goal: art.querySelector('.goal') };
}
function roundRect(ctx, x, y, w, h, r){ ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath(); }

/* ---------- mini-game: catch (oranges falling / lanterns rising) ---------- */
function catchGame({ goal: GOAL, good, bad, up = false, badRate = 0.3, badMsg, onBad }){
  return new Promise(res => {
    const { cv, ctx, W, H, goal } = makeCanvas(`${good} 0 / ${GOAL}`);
    const R = Math.max(22, Math.min(30, W / 13));
    let items = [], pops = [], got = 0, last = performance.now(), spawn = 0, rush = 0, running = true, done = false;
    window.__or = () => items;
    cv.addEventListener('pointerdown', e => {
      if(done) return;
      const r = cv.getBoundingClientRect(), x = e.clientX - r.left, y = e.clientY - r.top;
      for(let i = items.length - 1; i >= 0; i--){
        const it = items[i];
        if(Math.hypot(it.x - x, it.y - y) < R * 1.3){
          items.splice(i, 1);
          if(it.bad){
            got = Math.max(0, got - 1);
            const extra = onBad ? onBad() : '';
            if(extra === 'rush') rush = 3;
            pops.push({ x, y, t: 0, txt: badMsg + (extra === 'rush' ? ' ⚡' : '') });
            buzz(); shake(); goal.textContent = `${good} ${got} / ${GOAL}`;
          } else {
            got++; pluck(NOTE(67 + [0, 2, 4, 7, 9, 12][got % 6]));
            pops.push({ x, y, t: 0, txt: `+1 ${good}` });
            goal.textContent = `${good} ${got} / ${GOAL}`;
            if(got >= GOAL){ done = true; setTimeout(() => { running = false; res(); }, 800); }
          }
          break;
        }
      }
    });
    function frame(t){
      const dt = Math.min(0.05, (t - last) / 1000); last = t;
      spawn -= dt; if(rush > 0) rush -= dt;
      if(spawn <= 0 && !done){
        items.push({ x: R + Math.random() * (W - 2 * R), y: up ? H + R : -R, v: 105 + Math.random() * 90, bad: Math.random() < badRate, rot: Math.random() * 6, wob: Math.random() * 6 });
        spawn = 0.42 + Math.random() * 0.3;
      }
      ctx.clearRect(0, 0, W, H);
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      for(const it of items){
        it.y += (up ? -1 : 1) * it.v * dt * (rush > 0 ? 1.7 : 1); it.rot += dt * 2;
        if(up) it.x += Math.sin(it.rot + it.wob) * 0.6;
        ctx.save(); ctx.translate(it.x, it.y); ctx.rotate(Math.sin(it.rot) * (it.bad && up ? 1.2 : 0.3));
        if(it.bad && bad === 'sugar'){
          const s = R * 1.3;
          ctx.fillStyle = '#fff'; ctx.strokeStyle = '#c9b8a3'; ctx.lineWidth = 2;
          roundRect(ctx, -s / 2, -s / 2, s, s, 6); ctx.fill(); ctx.stroke();
          ctx.font = `${R * 0.7}px serif`; ctx.fillText('✨', s * 0.4, -s * 0.45);
        } else {
          if(!it.bad && up){ ctx.fillStyle = 'rgba(255,207,92,.35)'; ctx.beginPath(); ctx.arc(0, 0, R * 1.2, 0, 7); ctx.fill(); }
          ctx.font = `${R * 1.7}px serif`; ctx.fillText(it.bad ? bad : good, 0, 0);
        }
        ctx.restore();
      }
      items = items.filter(it => up ? it.y > -R : it.y < H + R);
      for(const p of pops){
        p.t += dt; ctx.globalAlpha = Math.max(0, 1 - p.t);
        ctx.font = '700 16px Fredoka, sans-serif'; ctx.fillStyle = '#fff'; ctx.strokeStyle = '#4a2c14'; ctx.lineWidth = 4;
        const px = Math.min(W - 90, Math.max(90, p.x)), py = p.y - p.t * 40;
        ctx.strokeText(p.txt, px, py); ctx.fillText(p.txt, px, py); ctx.globalAlpha = 1;
      }
      pops = pops.filter(p => p.t < 1);
      if(running) requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);
  });
}

/* ---------- mini-game: flying ---------- */
function flyGame(){
  const GOAL = 8;
  return new Promise(res => {
    info('🪽 Tap anywhere to flap. Catch the music notes.');
    const { cv, ctx, W, H, goal } = makeCanvas(`🎵 0 / ${GOAL}`);
    const svg = yara({ w: 100 }), img = svgImg(svg);
    const asp = (has('bow') ? 236 : 226) / 200;
    const size = Math.min(66, W / 6), hx = W * 0.25;
    let y = H / 2, vy = 0, got = 0, last = performance.now(), notes = [], spawn = 0.6, running = true, done = false, t0 = 0;
    const clouds = [...Array(4)].map(() => ({ x: Math.random() * W, y: 30 + Math.random() * H * 0.5, s: 0.5 + Math.random() }));
    cv.addEventListener('pointerdown', () => { vy = -250; pluck(NOTE(84), 0.05); });
    window.__fly = { notes: () => notes, y: () => y };
    function frame(t){
      const dt = Math.min(0.05, (t - last) / 1000); last = t; t0 += dt;
      vy += 520 * dt; y += vy * dt;
      if(y < size / 2){ y = size / 2; vy = 0; }
      if(y > H - 40 - size / 2){ y = H - 40 - size / 2; vy = -200; toast('Splash! The hair is soaked 😭'); }
      spawn -= dt;
      if(spawn <= 0 && !done){ notes.push({ x: W + 20, y: H * 0.15 + Math.random() * H * 0.6 }); spawn = 0.9 + Math.random() * 0.6; }
      ctx.clearRect(0, 0, W, H);
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.font = '40px serif';
      for(const c of clouds){ c.x -= 20 * c.s * dt; if(c.x < -50) c.x = W + 50; ctx.globalAlpha = 0.85; ctx.fillText('☁️', c.x, c.y); ctx.globalAlpha = 1; }
      ctx.fillStyle = 'rgba(60,127,174,.85)'; ctx.fillRect(0, H - 40, W, 40);
      ctx.fillStyle = '#8fcdf3';
      for(let x = -30; x < W + 30; x += 30){ ctx.beginPath(); ctx.arc(x + ((t0 * 40) % 30), H - 40, 10, Math.PI, 0); ctx.fill(); }
      ctx.font = '34px serif';
      for(const n of notes){
        n.x -= 175 * dt;
        const dx = hx - n.x, dy = y - n.y;
        if(Math.abs(dx) < size * 1.2 && Math.abs(dy) < size * 1.1){ n.y += dy * Math.min(1, dt * 2.5); }
        const ny = n.y + Math.sin(t0 * 3 + n.x * 0.02) * 6;
        ctx.fillStyle = '#4a2c14'; ctx.fillText('🎵', n.x, ny);
        if(!n.hit && Math.hypot(n.x - hx, ny - y) < size * 0.8){
          n.hit = true; got++; pluck(NOTE(62 + [0, 2, 4, 5, 7, 9, 11, 12][got % 8]));
          goal.textContent = `🎵 ${got} / ${GOAL}`;
          if(got >= GOAL && !done){ done = true; setTimeout(() => { running = false; res(); }, 900); }
        }
      }
      notes = notes.filter(n => n.x > -30 && !n.hit);
      ctx.save(); ctx.translate(hx, y); ctx.rotate(Math.max(-0.4, Math.min(0.5, vy / 600)));
      if(img.complete) ctx.drawImage(img, -size / 2, -size * asp / 2, size, size * asp);
      ctx.restore();
      if(running) requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);
  });
}

/* ---------- PRO: tuning by ear ---------- */
function tuneGame(){
  return new Promise(res => {
    const S = [['G', 55], ['D', 62], ['A', 69], ['E', 76]];
    let k = 0;
    info('🎻 No tuner. Tune by ear to within 3 cents. "Together" lets you hear the beats.');
    function show(){
      const [nm, m] = S[k];
      let fails = 0;
      const start = Math.round((Math.random() < 0.5 ? -1 : 1) * (15 + Math.random() * 40));
      art.innerHTML = panel(`<div class="sname">${nm} string <small>(${k + 1}/4)</small></div>
        <div class="meter" id="meter" style="display:none"><div class="zone"></div><div class="needle" id="needle"></div><span class="lo">flat</span><span class="hi">sharp</span></div>
        <input type="range" id="sl" min="-60" max="60" step="1" value="${start}">
        <div class="row"><button class="btn sm alt" data-d="-5">−5</button><button class="btn sm alt" data-d="-1">−1</button><button class="btn sm alt" data-d="1">+1</button><button class="btn sm alt" data-d="5">+5</button></div>
        <div class="row"><button class="btn sm alt" id="ref">🔔 Correct</button><button class="btn sm alt" id="mine">🎻 Mine</button><button class="btn sm alt" id="both">🔔+🎻 Together</button></div>
        <button class="btn" id="chk">✅ It's in tune</button>
        <div class="status" id="st">&nbsp;</div>`);
      const sl = $('#sl'), st = $('#st'), meter = $('#meter'), needle = $('#needle');
      const freq = () => NOTE(m) * Math.pow(2, (+sl.value) / 1200);
      const upd = () => { const c = +sl.value; needle.style.left = (50 + c * 50 / 60) + '%'; needle.classList.toggle('ok', Math.abs(c) <= 3); };
      upd();
      sl.oninput = upd;
      sl.onchange = () => tone(freq(), 0.8, 0, 0.14, 0);
      art.querySelectorAll('[data-d]').forEach(b => b.onclick = () => { sl.value = +sl.value + (+b.dataset.d); upd(); tone(freq(), 0.8, 0, 0.14, 0); });
      $('#ref').onclick = () => tone(NOTE(m), 1.2, 0, 0.14, 0);
      $('#mine').onclick = () => tone(freq(), 1.2, 0, 0.14, 0);
      $('#both').onclick = () => { tone(NOTE(m), 2.2, 0, 0.09, 0); tone(freq(), 2.2, 0, 0.09, 0); };
      $('#chk').onclick = () => {
        const c = +sl.value;
        if(Math.abs(c) <= 3){
          st.textContent = `In tune! (${c >= 0 ? '+' : ''}${c} cents) ✨`; pluck(NOTE(m));
          art.querySelectorAll('button,input').forEach(e => e.disabled = true);
          setTimeout(() => { k++; if(k < 4) show(); else res(); }, 1300);
        } else {
          fails++; buzz(); shake();
          st.textContent = 'Not quite. Listen to the beats… 🤨';
          if(fails === 4){ meter.style.display = ''; upd(); toast('Hattan lends you his tuner app. Embarrassing. 📱'); }
        }
      };
    }
    show();
  });
}

/* ---------- PRO: ear-training quiz engine ---------- */
async function retryOrSkip(fails, what, judge){
  if(fails < 3) return false;
  const c = await choose(judge, `${what}`, ['🔁 Try again', '😮‍💨 Skip (people will gossip)']);
  if(c === 1){ state.skips++; return true; }
  return false;
}
async function quiz({ title, sub, rounds, need, options, cols, makeQ, judge }){
  let fails = 0;
  while(true){
    let correct = 0;
    for(let r = 0; r < rounds; r++){

/* PRO: melodic dictation */
function genDictation(len, chromatic){
  const sc = [60, 62, 64, 65, 67, 69, 71, 72];
  let idx = 0, m = [60];
  for(let i = 1; i < len; i++){
    let s; do{ s = [-3, -2, -1, 1, 2, 3, 4][rand(7)]; }while(idx + s < 0 || idx + s > 7);
    idx += s; m.push(sc[idx]);
  }
  if(chromatic){
    /* pick an inner note that has a chromatic neighbour on the keyboard; if none, try a new melody */
    const opts = [];
    for(let k = 1; k < len - 1; k++) [m[k] + 1, m[k] - 1].forEach(n => { if(n > 60 && n < 72 && !sc.includes(n)) opts.push([k, n]); });
    if(!opts.length) return genDictation(len, chromatic);
    const [k, n] = opts[rand(opts.length)]; m[k] = n;
  }
  return m;
}

/* PRO: internal tempo */
function rhythmRound(title, sub){
  return new Promise(res => {
    art.innerHTML = panel(`<div class="sname">${title}</div><div class="qmeta">${sub}<br>4 clicks at 100 BPM, then silence. Keep the beat for 8 taps.<br>Pass: within ±1.5 BPM, steady to ±18 ms.</div>
      <div class="dots" id="dots">○○○○○○○○</div>
      <button class="btn tapbtn" id="tap" disabled>TAP</button>
      <button class="btn sm alt" id="go">▶ Start</button><div class="status" id="st">&nbsp;</div>`);
    const tap = $('#tap'), go = $('#go'), dots = $('#dots'), st = $('#st');
    let taps = [], armedAt = 0, live = false;
    go.onclick = () => {
      audio(); taps = []; dots.textContent = '○○○○○○○○'; st.innerHTML = '&nbsp;';
      go.disabled = true; tap.disabled = false;
      for(let i = 0; i < 4; i++) click(0.3 + i * 0.6, i === 0);
      armedAt = performance.now() + 300 + 3 * 600 + 300;
      live = true;
      info('🥁 Count-in… then keep the beat yourself.');
    };
    tap.onpointerdown = e => {
      e.preventDefault();
      if(!live) return;
      tap.classList.remove('pulse'); void tap.offsetWidth; tap.classList.add('pulse');
      const t = performance.now();
      if(t < armedAt) return;
      taps.push(t); pluck(NOTE(48 + taps.length % 2 * 7), 0.12);
      dots.textContent = '●'.repeat(taps.length) + '○'.repeat(8 - taps.length);
      if(taps.length === 8){
        live = false; tap.disabled = true; go.disabled = false;
        const iv = taps.slice(1).map((t, i) => t - taps[i]);
        const mean = iv.reduce((a, b) => a + b, 0) / iv.length;
        const sd = Math.sqrt(iv.reduce((a, b) => a + (b - mean) ** 2, 0) / iv.length);
        const bpm = 60000 / mean;
        st.textContent = `${bpm.toFixed(1)} BPM · steady to ±${sd.toFixed(0)} ms`;
        const pass = Math.abs(bpm - 100) <= 1.5 && sd <= 18;
        if(pass){ sparkle(); setTimeout(() => res(true), 1300); }
        else { buzz(); info(Math.abs(bpm - 100) > 1.5 ? (bpm > 100 ? 'Rushing! 🏃‍♀️ Again.' : 'Dragging… 🐌 Again.') : 'Tempo fine, but wobbly. Again.'); setTimeout(() => res(false), 1500); }
      }
    };
    info('Tap ▶ Start when ready.');
  });
}

/* ---------- confetti ---------- */
function confetti(seconds = 7){
  const cv = $('#confetti'), dpr = window.devicePixelRatio || 1;
  const W = innerWidth, H = innerHeight; cv.width = W * dpr; cv.height = H * dpr;
  const ctx = cv.getContext('2d'); ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  const cols = ['#ffcc33', '#f59e2b', '#e07b12', '#8fc3e6', '#f6a5a5', '#6abf4b'];
  let ps = [], last = performance.now(), age = 0;
  function frame(t){
    const dt = Math.min(0.05, (t - last) / 1000); last = t; age += dt;
    if(age < seconds) for(let i = 0; i < 4; i++) ps.push({ x: Math.random() * W, y: -10, vx: (Math.random() - 0.5) * 60, vy: 80 + Math.random() * 120, r: Math.random() * 6, s: 5 + Math.random() * 6, c: cols[Math.random() * cols.length | 0] });
    ctx.clearRect(0, 0, W, H);
    for(const p of ps){ p.x += p.vx * dt; p.y += p.vy * dt; p.r += dt * 5; ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.r); ctx.fillStyle = p.c; ctx.fillRect(-p.s / 2, -p.s / 4, p.s, p.s / 2); ctx.restore(); }
    ps = ps.filter(p => p.y < H + 20);
    if(age < seconds || ps.length) requestAnimationFrame(frame); else ctx.clearRect(0, 0, W, H);
  }
  requestAnimationFrame(frame);
}

async function lawn(){
  await enterWorld(0, 'lawn', '🌻', 'La La Lawn', 'The final stop. Everyone is waiting.', '🌻 La La Lawn', 'Finale');
  art.innerHTML = fieldHTML();
  VOICE.arm = true;
  await talk([
    ['', 'Welcome to La La Lawn: a field of sunflowers that never die, right next to a beach. 🌻🌊'],
    ['', '(Unlike the last sunflower. Sorry about that one.)'],
    ['Yara', 'A beach?? Bruh. I don\'t tan. I get CRISPED. 🔥'],
    ['', 'True. Last beach trip she came home medium-rare. The hair was the only part that survived.'],
    ['', 'That\'s why this beach only opens at night. 🌙 She can sit by it as long as she wants.'],
    ['Yara', '…okay that\'s actually perfect.']
  ]);
  await say('', 'Each sunflower sings one note. Play the first line of Happy Birthday on them, by ear. No labels. 🙂');
  info('🌻 Play "Happy birthday to you" (first line) on the flowers.');
  await bloomGame();
  await say('', 'The field hums softly, a bit like her favourite 2020 Adrianne Lenker album.');
  art.querySelector('.cabin').classList.add('show');
  /* a soft, original fingerpicked pattern (not the song) to set the mood */
  [[50, 57, 62, 66], [47, 54, 59, 62], [43, 50, 55, 59], [45, 52, 57, 61]].forEach((ch, i) => ch.forEach((n, j) => pluck(NOTE(n), 0.07, i * 0.9 + j * 0.18)));
  await say('', 'At the edge of the field sits a little wooden cabin with one warm window, the kind of place you could record a whole album on tape.');
  if(VOICE.ok){
    await say('', 'Something is waiting behind that window. Just for her. 💛');
    await listenAtWindow();
  }
  art.querySelector('.piano').classList.add('show'); sparkle();
  const row = [...art.querySelectorAll('#giftrow span')];
  for(let i = 0; i < row.length; i++){ await sleep(220); row[i].classList.add('in'); pluck(NOTE(72 + i * 2), 0.12); }
  await talk([
    ['', 'All seven gifts are here. Belle got a whole library. Yara got a whole field.'],
    ['', 'Then the gifts start to glow, one by one…']
  ]);
  const REVEAL = [
    ['brush', '🖌️ Bob Ross\'s talent', 'Turning a blank canvas into something beautiful. It was never in the brush. She does it every time she picks up her violin.'],
    ['lantern', '🏮 Rapunzel\'s hard work', 'Two hundred things a day and still dreaming. Teaching, practising, studying. That was never Rapunzel\'s. It\'s hers.'],
    ['scale', '🐉 Astrid\'s courage', 'Jumping into the unknown with tiny wings and enormous hair. She did it seven times today. She does it all the time.'],
    ['bow', '🎀 Rarity\'s flamboyance', 'The sparkle, the drama, the "DARLING." Rarity didn\'t give her that. She was born fabulous.'],
    ['piano', '🎹 A La La Land dreamer\'s heart', 'The stubborn hope of every dreamer in her favourite film. The piano is just where she\'ll keep it.'],
    ['bracelet', '📿 A brand-new era', 'Every birthday starts a new era. This one is hers to write.'],
    ['voucher', '🎟️ Hattan\'s love', 'The voucher was never for a song. It\'s for something that doesn\'t expire: Hattan\'s love. Off-key, but always on time.']
  ];
  const hero = art.querySelector('.heroic svg');
  for(let i = 0; i < REVEAL.length; i++){
    const [k, title, line] = REVEAL[i];
    const el = k === 'piano' ? art.querySelector('.piano') : art.querySelector(`#giftrow [data-k="${k}"]`);
    el.classList.add('glow'); sparkle();
    await say(title, line);
    el.classList.remove('glow'); el.classList.add('gone');
    pluck(NOTE([67, 69, 71, 72, 74, 76, 79][i]), 0.2);
    hero.style.filter = `drop-shadow(0 0 ${4 + i * 3}px rgba(255,216,74,.95))`;
    await sleep(500);
  }
  art.querySelector('.piano').classList.remove('gone');
  await talk([
    ['', 'None of it was ever hidden in other worlds. It was in her all along. 🌻'],
    ['', 'And the Birthday Committee? It was everyone she met today. They\'ve all come to say it together…']
  ]);
  if(state.skips > 0) await say('', `(They are also gossiping about the ${state.skips} skip${state.skips > 1 ? 's' : ''}. Lovingly.)`);
  info('🎻 🎂 🎻');
  art.querySelectorAll('.flower').forEach(f => f.classList.add('dance'));
  confetti(8);
  await playHappyBirthday();
  const cabinIcon = '<svg width="22" height="20" viewBox="0 0 64 56" style="vertical-align:-4px"><rect x="8" y="24" width="48" height="30" fill="#8a5a32"/><polygon points="2,26 32,4 62,26" fill="#5a3b22"/><rect class="win" x="16" y="30" width="14" height="12" fill="#ffd56b"/></svg>';
  const wrap = document.createElement('div'); wrap.className = 'cardwrap';
  wrap.innerHTML = `<div class="card"><div class="cardtop">🌻🎻🍊🪽🎀</div><h2>Happy Birthday, Yara!</h2><p id="msg"></p><div class="sig">Yours lovingly,<br>${FROM}.</div>
    <div class="row" style="margin-top:8px">${VOICE.ok ? `<button class="btn sm alt" id="voiceBtn">${cabinIcon} <span>▶️ Listen again</span></button>` : ''}<button class="btn sm" id="again2">🔁 Play again</button></div></div>`;
  art.querySelector('.field').appendChild(wrap);
  $('#msg').innerHTML = FINAL_MESSAGE.split(/\n\s*\n/).map(x => x.replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))).join('<span style="display:block;height:7px"></span>');
  $('#boxwrap').style.display = 'none';
  confetti(4);
  const cabin = art.querySelector('.cabin');
  if(VOICE.ok){
    const a = VOICE.el, vb = $('#voiceBtn'), lab = vb.querySelector('span');
    const playing = on => { cabin.classList.toggle('talking', on); vb.classList.toggle('live', on); lab.textContent = on ? '⏸️ Pause' : '▶️ Listen again'; };
    a.onplay = () => playing(true); a.onpause = () => playing(false); a.onended = () => { playing(false); a.currentTime = 0; };
    vb.onclick = () => { if(a.paused){ a.muted = MUTED; a.play().catch(() => {}); } else a.pause(); };
    playing(false);
  }
  await new Promise(r => { $('#again2').onclick = () => { blip(); r(); }; });
  if(VOICE.el){ try{ VOICE.el.pause(); VOICE.el.currentTime = 0; }catch(e){} }
  VOICE.arm = false;
  $('#boxwrap').style.display = '';
}

const CHAPTERS = [prologue, painting, tower, berk, kitchen, pony, jazz, eras, lawn];
const CH_NAMES = ['The Burrow', 'The Painting', 'The Tower', 'Berk', 'The Kitchen', 'Pony Land', 'The Jazz Club', 'The Eras Stage', 'La La Lawn'];
const REWARDS = [null, { s: 'G', g: 'brush' }, { s: 'D', g: 'lantern' }, { s: 'A', g: 'scale' }, { s: 'E', g: 'voucher' }, { g: 'bow' }, { g: 'piano' }, { g: 'bracelet' }, null];

async function main(){
  while(true){
    state.skips = 0; state.gifts = []; state.strings = []; state.sugar = 0;
    document.querySelectorAll('#strings b').forEach(b => b.classList.remove('on'));
    updateBag();
    const sv = load();
    const start = await titleScreen(sv);
    if(start > 0){
      state.sugar = sv.sugar || 0; state.skips = sv.skips || 0;
      for(let i = 0; i < start; i++){ const r = REWARDS[i]; if(r){ if(r.s) markString(r.s); if(r.g && !has(r.g)) state.gifts.push(r.g); } }
      updateBag();
    }
    for(let i = start; i < CHAPTERS.length; i++){
      await CHAPTERS[i]();
      save(i + 1 < CHAPTERS.length ? i + 1 : 0);
    }
  }
}
main();
</script>
